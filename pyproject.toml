[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bestatml"
version = "0.1.0"
description = "Leakage-safe automated ensemble learning with a scikit-learn compatible API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BestatML Contributors"}]
keywords = ["machine-learning", "automl", "ensemble", "scikit-learn", "stacking", "blending"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
boosting = [
  "catboost>=1.2",
  "xgboost>=2.0",
  "lightgbm>=4.0",
]
all = [
  "catboost>=1.2",
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.0",
]

[project.urls]
"Repository" = "https://github.com/xdiyorbekw/BestatML"
"Issues" = "https://github.com/xdiyorbekw/BestatML/issues"

[tool.setuptools.packages.find]
include = ["bestatml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
